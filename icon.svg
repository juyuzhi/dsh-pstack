    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#2B3FBB"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#0F1222"/>
  <g>
    <rect x="26" y="26" width="76" height="24" rx="6" fill="url(#deck)" opacity="0.55"/>
    <rect x="26" y="56" width="76" height="24" rx="6" fill="url(#deck)" opacity="0.8"/>
    <rect x="26" y="86" width="76" height="24" rx="6" fill="url(#deck)"/>
    <circle cx="112" cy="26" r="9" fill="#7C93FF"/>
